name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd "${EC2_APP_DIR:-$HOME/Lost-and-Found-Portal}"
            git pull --ff-only origin main
            cd backend
            /usr/bin/mvn clean package -DskipTests
            sudo systemctl restart lostfound
            sudo systemctl is-active --quiet lostfound
